<h2>🛒 Cart</h2>
<div *ngFor="let item of cart.items()">
    {{ item.name }} (x{{ item.quantity }}) - {{ item.price | currency }}
    <button (click)="remove(item.id)">Remove</button>
</div>

<p>Total Items: {{ cart.totalQuantity() }}</p>
<p>Total Price: {{ cart.totalPrice() | currency }}</p>
<button (click)="cart.clearCart()">Clear Cart</button>
